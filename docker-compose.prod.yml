version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cc_db
    restart: always
    environment:
      POSTGRES_DB: capacity_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No public port mapping for database in production!
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capacity_connect"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cc_api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/capacity_connect
      JWT_SECRET: ${JWT_SECRET}
      CERT_HMAC_SECRET: ${CERT_HMAC_SECRET}
      UPLOAD_DIR: /data/uploads
      LLM_API_KEY: ${LLM_API_KEY:-}
      COOKIE_SECURE: "True"
      COOKIE_SAMESITE: "lax"
      PORT: 8000
    expose:
      - "8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cc_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: cc_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.ssl.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/data/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  uploads_data:
